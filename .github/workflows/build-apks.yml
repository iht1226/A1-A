name: Build phone and watch APKs

on:
  workflow_dispatch:
  push:

permissions:
  contents: read

concurrency:
  group: sleep-alarm-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    needs: signing
    env:
      SIGNING_KEYSTORE_PATH: ${{ needs.signing.outputs.ready == 'true' && '/tmp/sleep-alarm-signing.p12' || '' }}
      SIGNING_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      SIGNING_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    name: Android debug APKs
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out project
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true
          packages: platform-tools

      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0" "platform-tools"

      - name: Restore fixed key for both debug artifacts when configured
        if: needs.signing.outputs.ready == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$SIGNING_KEYSTORE_PATH"

      - name: Set monotonic APK version code
        run: echo "APP_VERSION_CODE=$((1000 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"

      - name: Make existing Gradle Wrapper executable
        run: chmod +x gradlew

      - name: Build phone and watch APKs with project Wrapper
        run: ./gradlew --no-daemon --stacktrace :phone:assembleDebug :wear:assembleDebug

      - name: Test existing signing-certificate pin policy
        run: python3 -m unittest discover -s tools -p 'test_*.py'

      - name: Test alarm safety and causal adaptive decisions
        run: ./gradlew --no-daemon --stacktrace :core:model:test :core:analysis:test :core:alarm:testDebugUnitTest :core:sensors:testDebugUnitTest :core:update:testDebugUnitTest :core:diagnostics:testDebugUnitTest

      - name: Upload phone APK
        id: phone
        uses: actions/upload-artifact@v4
        with:
          name: phone-debug
          path: phone/build/outputs/apk/debug/phone-debug.apk
          if-no-files-found: error
          compression-level: 6

      - name: Upload watch APK
        id: watch
        uses: actions/upload-artifact@v4
        with:
          name: wear-debug
          path: wear/build/outputs/apk/debug/wear-debug.apk
          if-no-files-found: error
          compression-level: 6

      - name: Add mobile download links to run summary
        env:
          PHONE_ARTIFACT_URL: ${{ steps.phone.outputs.artifact-url }}
          WATCH_ARTIFACT_URL: ${{ steps.watch.outputs.artifact-url }}
        run: |
          python3 - <<'PY'
          import hashlib
          import os
          from pathlib import Path

          rows = [
              "## APK downloads",
              "Sign in to GitHub, then open either link or this run's Artifacts section. Extract each downloaded ZIP to get the APK.",
              "",
          ]
          for module, label, url_key in [
              ("phone", "phone-debug", "PHONE_ARTIFACT_URL"),
              ("wear", "wear-debug", "WATCH_ARTIFACT_URL"),
          ]:
              apk = Path(module) / "build/outputs/apk/debug" / f"{module}-debug.apk"
              digest = hashlib.sha256(apk.read_bytes()).hexdigest()
              rows += [
                  f"- [{label}]({os.environ[url_key]}) — {apk.stat().st_size:,} bytes",
                  f"  SHA-256: `{digest}`",
              ]
          with Path(os.environ["GITHUB_STEP_SUMMARY"]).open("a", encoding="utf-8") as summary:
              summary.write("\n".join(rows) + "\n")
          PY

      - name: Remove temporary debug signing material
        if: always() && needs.signing.outputs.ready == 'true'
        run: rm -f "$SIGNING_KEYSTORE_PATH"

  signing:
    name: Inspect fixed signing configuration
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.check.outputs.ready }}
    steps:
      - id: check
        name: Check required repository Secrets without revealing them
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          count=0
          for name in KEYSTORE STORE_PASS KEY_ALIAS KEY_PASS; do
            if [[ -n "${!name}" ]]; then count=$((count + 1)); fi
          done
          if [[ "$count" -eq 4 ]]; then
            echo 'ready=true' >> "$GITHUB_OUTPUT"
          elif [[ "$count" -eq 0 ]]; then
            echo 'ready=false' >> "$GITHUB_OUTPUT"
            echo '### Fixed signing is not configured' >> "$GITHUB_STEP_SUMMARY"
            echo 'Debug APKs and tests will run. Automatic update Releases are NOT published until all four ANDROID_* signing Secrets are configured. See docs/UPDATES.md.' >> "$GITHUB_STEP_SUMMARY"
          else
            echo '::error::Signing Secrets are incomplete. Configure all four ANDROID_* Secrets; no unsigned update is published.'
            exit 1
          fi

  publish-update:
    name: Publish fixed-signature update APKs
    needs: [build, signing]
    if: needs.signing.outputs.ready == 'true' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      SIGNING_KEYSTORE_PATH: /tmp/sleep-alarm-signing.p12
      SIGNING_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      SIGNING_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true
          packages: platform-tools
      - name: Prepare SDK and private keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          sdkmanager "platforms;android-36" "build-tools;35.0.0" "platform-tools"
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$SIGNING_KEYSTORE_PATH"
          echo "APP_VERSION_CODE=$((1000 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"
          chmod +x gradlew
      - name: Build both signed update APKs with existing Wrapper
        run: ./gradlew --no-daemon --stacktrace :phone:assembleRelease :wear:assembleRelease
      - name: Verify signatures and generate public update metadata
        run: python3 tools/release_metadata.py
      - name: Publish APKs and metadata together after successful tests
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="apk-build${APP_VERSION_CODE}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo '::error::This update version was already published. Never overwrite an installed update version; start a new run.'
            exit 1
          fi
          gh release create "$tag" build/update-release/phone-update.apk build/update-release/wear-update.apk build/update-release/update.json --target "$GITHUB_SHA" --title "Sleep Alarm build ${APP_VERSION_CODE}" --notes 'Fixed-signature APKs. Installations require matching existing signatures and user approval. Watch native installation depends on firmware support. Hardware alarm and sleep-wake effects remain unverified.' --draft
          gh release edit "$tag" --draft=false --latest
      - uses: actions/upload-artifact@v4
        with:
          name: phone-update
          path: build/update-release/phone-update.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: wear-update
          path: build/update-release/wear-update.apk
          if-no-files-found: error
      - name: Remove temporary private signing material
        if: always()
        run: rm -f "$SIGNING_KEYSTORE_PATH"
